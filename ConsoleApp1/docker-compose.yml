services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: consoleapp1
      POSTGRES_USER: consoleapp1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - consoleapp1-postgres-data:/var/lib/postgresql/data

volumes:
  consoleapp1-postgres-data:
